<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add New Service</h2>
        
        <form th:action="@{/admin/services/add}" th:object="${service}" method="post">
            <label>Service Name:</label>
            <input type="text" th:field="*{name}" required />

            <label>Description:</label>
            <textarea th:field="*{description}" rows="4" required></textarea>

            <label>Price (₹):</label>
            <input type="number" step="0.01" th:field="*{price}" required />

            <button type="submit">Add Service</button>
        </form>

        <p><a th:href="@{/admin/dashboard}">← Back to Dashboard</a></p>
    </div>
</body>
</html>
